[project]
name = "necto-sdk"
dynamic = ["version"]
description = "Instrument multi-agent AI apps and stream their events to a necto server"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3.0"]
# Optional: enables the real-framework integration tests (they skip when absent).
frameworks = ["langgraph>=0.2.28", "langchain-core>=0.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "necto_sdk/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["necto_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]
