[project]
name = "necto-sdk"
version = "0.1.0"
description = "Instrument multi-agent AI apps and stream their events to a necto server"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["necto_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
