# necto self-host stack.
#
# One command:
#   docker compose up -d --build
#   -> UI + API on http://localhost:8000   (demo data seeded on first boot)
#
# Development still runs the API and UI natively (docs/DEVELOPMENT.md):
#   docker compose up -d db
#
# NOTE: maps Postgres to host port 5432 for the native workflow. If you are running the
# portable development Postgres (docs/DEVELOPMENT.md, Option A), stop it first:
#   pg_ctl -D %LOCALAPPDATA%/Programs/necto-tools/pgdata stop

services:
  db:
    image: postgres:16-alpine
    container_name: necto-db
    environment:
      POSTGRES_USER: necto
      POSTGRES_PASSWORD: necto
      POSTGRES_DB: necto
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U necto -d necto"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: necto-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      NECTO_DATABASE_URL: postgresql+psycopg://necto:necto@db:5432/necto
      # Demo runs on a fresh database. Set to 0 for a purely empty instance.
      NECTO_SEED: "1"
      NECTO_WEB_DIR: /app/web
    ports:
      - "8000:8000"

volumes:
  pgdata:
