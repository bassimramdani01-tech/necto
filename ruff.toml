# Repo-wide ruff defaults. server/ and sdk/ keep their own pyproject configs
# (the SDK targets Python 3.10, the server 3.12); this covers scripts/ and examples/.
line-length = 100
target-version = "py310"

[lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[lint.isort]
known-first-party = ["necto_sdk", "necto_server"]

[lint.per-file-ignores]
# These scripts prepend the repo's sdk/ to sys.path before importing it.
"scripts/*.py" = ["E402"]
"examples/*.py" = ["E402"]
