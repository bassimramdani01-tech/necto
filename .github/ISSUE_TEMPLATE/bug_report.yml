name: Bug report
description: Something is wrong with necto.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the exact command and the output you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: e.g. v0.1.0 or the commit hash
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - server / API
        - python SDK
        - web UI
        - docker / self-host
        - docs
    validations:
      required: true
