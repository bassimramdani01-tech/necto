name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: necto
          POSTGRES_PASSWORD: necto
          POSTGRES_DB: necto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U necto -d necto"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NECTO_DATABASE_URL: postgresql+psycopg://necto:necto@127.0.0.1:5432/necto
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run alembic upgrade head
      - run: uv run pytest -q
