name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server (migrations + pytest + ruff)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: necto
          POSTGRES_PASSWORD: necto
          POSTGRES_DB: necto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U necto -d necto"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      NECTO_DATABASE_URL: postgresql+psycopg://necto:necto@127.0.0.1:5432/necto
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        working-directory: server
        run: uv sync --frozen
      - name: Migrations
        working-directory: server
        run: uv run --no-sync alembic upgrade head
      - name: Tests
        working-directory: server
        run: uv run --no-sync pytest -q

  sdk:
    name: sdk (pytest, real LangGraph)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install (with framework extras)
        run: uv sync --group frameworks
      - name: Tests
        run: uv run pytest -q

  web:
    name: web (vitest + production build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile --allow-build=esbuild
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - name: Ruff
        run: |
          uvx ruff check .
          uvx ruff format --check .

  docker:
    name: docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t necto-app:ci .
